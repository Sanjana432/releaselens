[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releaselens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opentelemetry-sdk==1.45.2", "fastapi==0.165.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
releaselens = "releaselens.__main__:main"

[tool.setuptools.package-data]
releaselens = ["static/*"]
